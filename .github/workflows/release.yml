name: release

# Pushing a semver tag on main (v1.2.3, v1.2.3-rc.1) builds the binaries and publishes them as GitHub release;
# run by hand (workflow_dispatch), it only builds.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            bin: norc
          - name: macos-arm64
            os: macos-latest
            bin: norc
          - name: windows-x86_64
            os: windows-latest
            bin: norc.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # HashLink sources (lib/hashlink), compiled into the binary
          submodules: true

      # Tag filters can't select a branch: only release tags on main
      - name: Check that the tag is on main
        if: github.event_name == 'push'
        shell: bash
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: ./.github/actions/setup

      # Haxe needs the hashlink haxelib to generate HashLink/C code
      - name: Register the hashlink haxelib
        shell: bash
        run: haxelib dev hashlink lib/hashlink/other/haxelib

      - name: Install musl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          make norc
          ./norc --help

      # The generated C code, compiled by the arm64 job (without haxe)
      - uses: actions/upload-artifact@v7
        if: matrix.name == 'linux-x86_64'
        with:
          name: c-code
          path: out/
          if-no-files-found: error
          # removed by the arm64 job, kept at most a day if that fails
          retention-days: 1

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc
          # haxe and haxelib are installed outside of MSYS2
          path-type: inherit

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make norc
          ./norc.exe --help

      - uses: actions/upload-artifact@v7
        with:
          name: norc-${{ github.ref_name }}-${{ matrix.name }}
          path: ${{ matrix.bin }}
          if-no-files-found: error

  # Linux arm64 (e.g. Raspberry Pi with 64-bit OS): compiles the C code generated by the linux-x86_64 job,
  # haxe doesn't run on arm64 runners
  build-linux-arm64:
    needs: build
    # also if other platforms failed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      # to remove the c-code artifact
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          # HashLink sources (lib/hashlink), compiled into the binary
          submodules: true

      - uses: actions/download-artifact@v8
        with:
          name: c-code
          path: out

      - name: Install musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: |
          make from-c
          file norc
          ./norc --help

      - uses: actions/upload-artifact@v7
        with:
          name: norc-${{ github.ref_name }}-linux-arm64
          path: norc
          if-no-files-found: error

      # only needed to build this binary
      - name: Remove the c-code artifact
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '.artifacts[] | select(.name == "c-code") | .id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

  # The GitHub release of the tag: the binaries of all targets, packed (tar.gz, zip for Windows), and their checksums
  release:
    needs: [build, build-linux-arm64]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check the tag (semver)
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "not a semver tag: $GITHUB_REF_NAME"; exit 1; }

      - uses: actions/download-artifact@v8
        with:
          pattern: norc-${{ github.ref_name }}-*
          path: artifacts

      # artifacts/norc-<tag>-<target>/norc[.exe] -> dist/norc-<tag>-<target>.tar.gz (.zip for Windows)
      - name: Pack the binaries
        shell: bash
        run: |
          mkdir dist
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            if [ -f "$dir/norc.exe" ]; then
              (cd "$dir" && zip -q "../../dist/$name.zip" norc.exe)
            else
              chmod +x "$dir/norc"
              tar -czf "dist/$name.tar.gz" -C "$dir" norc
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist
          cat dist/SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # a pre-release version (v1.2.3-rc.1): a GitHub pre-release
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "norc ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag \
            $prerelease
