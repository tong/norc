name: release

# Pushing a semver tag on main (v1.2.3, v1.2.3-rc.1) builds the binaries and publishes them as GitHub release;
# run by hand (workflow_dispatch), it only builds.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # HashLink sources (lib/hashlink), compiled into the binary
          submodules: true

      # Tag filters can't select a branch: only release tags on main
      - name: Check that the tag is on main
        if: github.event_name == 'push'
        shell: bash
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: ./.github/actions/setup

      # Haxe needs the hashlink haxelib to generate HashLink/C code
      - name: Register the hashlink haxelib
        shell: bash
        run: haxelib dev hashlink lib/hashlink/other/haxelib

      - name: Install musl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          make norc
          ./norc --help

      # The generated C code, compiled by the arm64 job (without haxe)
      - uses: actions/upload-artifact@v7
        if: matrix.name == 'linux-x86_64'
        with:
          name: c-code
          path: out/
          if-no-files-found: error
          # removed by the arm64 job, kept at most a day if that fails
          retention-days: 1

      # with GStreamer for norc-rtc; updated: the package database of the runner image can refer to removed versions
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: >-
            make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-gstreamer mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good mingw-w64-ucrt-x86_64-gst-plugins-bad mingw-w64-ucrt-x86_64-libnice
          # haxe and haxelib are installed outside of MSYS2
          path-type: inherit

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make norc
          ./norc.exe --help

      # --- norc-rtc: the media of calls, with GStreamer (of the system on Linux and macOS, bundled on Windows) ---

      - name: Install GStreamer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libgstreamer-plugins-bad1.0-dev libjson-glib-dev \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-good gstreamer1.0-nice

      - name: Install GStreamer (macOS)
        if: runner.os == 'macOS'
        run: brew install pkgconf gstreamer libnice-gstreamer json-glib

      # with test signals: two norc-rtc connect to each other and receive the media of the other
      - name: Build and test norc-rtc (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          make norc-rtc
          python3 rtc/loopback.py --seconds 0 ./norc-rtc
          python3 rtc/loopback.py --video --seconds 0 ./norc-rtc


      # a folder with norc, norc-rtc, the plugins and the DLLs: runs without MSYS2
      - name: Build and bundle norc-rtc (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make norc-rtc CC=gcc
          rtc/bundle-windows.sh dist/norc
          cp norc.exe dist/norc/bin/

      # the bundle alone: without MSYS2 in PATH
      - name: Test norc-rtc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $env:PATH = "C:\Windows\System32;C:\Windows"
          & $python rtc/loopback.py --seconds 0 dist/norc/bin/norc-rtc.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $python rtc/loopback.py --video --seconds 0 dist/norc/bin/norc-rtc.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & dist/norc/bin/norc.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # norc and norc-rtc, the completion of zsh and bash (install.sh installs them)
      - uses: actions/upload-artifact@v7
        if: runner.os != 'Windows'
        with:
          name: norc-${{ github.ref_name }}-${{ matrix.name }}
          path: |
            norc
            norc-rtc
            extras/zsh/_norc
            extras/bash/norc
          if-no-files-found: error

      # the folder norc
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: norc-${{ github.ref_name }}-${{ matrix.name }}
          path: dist
          if-no-files-found: error

  # Linux arm64 (e.g. Raspberry Pi with 64-bit OS): compiles the C code generated by the linux-x86_64 job,
  # haxe doesn't run on arm64 runners
  build-linux-arm64:
    needs: build
    # also if other platforms failed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      # to remove the c-code artifact
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          # HashLink sources (lib/hashlink), compiled into the binary
          submodules: true

      - uses: actions/download-artifact@v8
        with:
          name: c-code
          path: out

      - name: Install musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: |
          make from-c
          file norc
          ./norc --help

      - name: Install GStreamer
        run: |
          sudo apt-get install -y libgstreamer-plugins-bad1.0-dev libjson-glib-dev \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-good gstreamer1.0-nice

      - name: Build and test norc-rtc
        run: |
          make norc-rtc
          python3 rtc/loopback.py --seconds 0 ./norc-rtc
          python3 rtc/loopback.py --video --seconds 0 ./norc-rtc

      - uses: actions/upload-artifact@v7
        with:
          name: norc-${{ github.ref_name }}-linux-arm64
          path: |
            norc
            norc-rtc
            extras/zsh/_norc
            extras/bash/norc
          if-no-files-found: error

      # only needed to build this binary
      - name: Remove the c-code artifact
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '.artifacts[] | select(.name == "c-code") | .id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

  # The GitHub release of the tag: one archive per target with norc and norc-rtc (for calls), tar.gz (zip for Windows,
  # Linux and macOS with the completions in extras/), and their checksums
  release:
    needs: [build, build-linux-arm64]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check the tag (semver)
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "not a semver tag: $GITHUB_REF_NAME"; exit 1; }

      - uses: actions/download-artifact@v8
        with:
          pattern: norc-${{ github.ref_name }}-*
          path: artifacts

      # artifacts/norc-<tag>-<target>/<files> -> dist/norc-<tag>-<target>.tar.gz (.zip for Windows):
      # norc and norc-rtc, for Windows the folder norc (bin/ with the programs and DLLs, lib/ with the plugins)
      - name: Pack the binaries
        shell: bash
        run: |
          mkdir dist
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            files=$(ls "$dir")
            if [[ $name == *-windows-* ]]; then
              (cd "$dir" && zip -qr "../../dist/$name.zip" $files)
            else
              # the permissions are lost in artifacts (the programs; extras/: the completions)
              (cd "$dir" && chmod +x norc norc-rtc)
              tar -czf "dist/$name.tar.gz" -C "$dir" $files
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist
          cat dist/SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # a pre-release version (v1.2.3-rc.1): a GitHub pre-release
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "norc ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag \
            $prerelease
